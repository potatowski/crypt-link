name: deploy-worker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to deploy (vX.Y.Z)
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      DOMAIN: ${{ vars.CRYPTLINK_DOMAIN }}
      REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
    steps:
      - name: Check configuration
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$D1_DATABASE_ID" ] || missing="$missing CLOUDFLARE_D1_DATABASE_ID"
          [ -n "$DOMAIN" ] || missing="$missing CRYPTLINK_DOMAIN"
          [ "$HAS_TOKEN" = "true" ] || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          if [ -n "$missing" ]; then
            echo "::error::missing configuration:$missing"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::only release tags (vX.Y.Z) can be deployed, got: $REF"
            exit 1
          fi
          if ! printf '%s' "$DOMAIN" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$'; then
            echo "::error::CRYPTLINK_DOMAIN is not a valid host name"
            exit 1
          fi
          if ! printf '%s' "$D1_DATABASE_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::CLOUDFLARE_D1_DATABASE_ID is not a UUID"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Configure the D1 database and custom domain
        working-directory: worker
        run: |
          sed -i "s/^database_id = .*/database_id = \"$D1_DATABASE_ID\"/" wrangler.toml
          sed -i "/^compatibility_date = /a routes = [{ pattern = \"$DOMAIN\", custom_domain = true }]" wrangler.toml
          test "$(grep -cE '^(database_id|routes) = ' wrangler.toml)" -eq 2
          grep -E '^(database_id|routes) = ' wrangler.toml

      - name: Apply D1 migrations and deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.162.0"
          command: |
            d1 migrations apply crypt-link --remote
            deploy
