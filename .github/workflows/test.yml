name: Run tests
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: api/go.mod
        cache-dependency-path: api/go.sum

    - name: Install dependencies
      run: cd api && go mod download

    # TODO: remove once config is read from environment variables (no embedded .env)
    - name: Create env file
      run: cd api && cp config/.env.example config/.env

    - name: Vet
      run: cd api && go vet ./...

    - name: Run tests
      run: cd api && go test -race -v ./...

    - name: Build
      run: cd api && go build -o server ./cmd/server

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: api/go.mod
        cache-dependency-path: api/go.sum

    # TODO: remove once config is read from environment variables (no embedded .env)
    - name: Create env file
      run: cd api && cp config/.env.example config/.env

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.5
        working-directory: api

  govulncheck:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: api/go.mod
        cache-dependency-path: api/go.sum

    # TODO: remove once config is read from environment variables (no embedded .env)
    - name: Create env file
      run: cd api && cp config/.env.example config/.env

    - name: govulncheck
      run: cd api && go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # TODO: remove once config is read from environment variables (no embedded .env)
    - name: Create env file
      run: cd api && cp config/.env.example config/.env

    - name: Build Docker image (no push)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/go/Dockerfile
        push: false
