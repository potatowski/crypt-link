name: Bug report
description: Something doesn't work as expected
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Never paste a CryptLink link, message content or your `.env` here. For security problems use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error message or HTTP status code if you saw one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a message with expiry set to 1 hour
        2. Open the link in another browser
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Creating a message
        - Opening or revealing a message
        - API
        - Docker Compose setup
        - HTTPS with Caddy
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: If the problem is in the web page
  - type: input
    id: version
    attributes:
      label: CryptLink version or commit
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `docker compose logs go nginx`. Remove anything you don't want to share.
      render: text
