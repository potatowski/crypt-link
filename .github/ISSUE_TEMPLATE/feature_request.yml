name: Feature request
description: Suggest an idea or an improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you run into.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like CryptLink to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: principles
    attributes:
      label: Principles
      options:
        - label: The server still never sees the plaintext or the key, and a message can still be read only once
          required: true
