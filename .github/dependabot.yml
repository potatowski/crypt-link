version: 2
updates:
  - package-ecosystem: gomod
    directory: /api
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: fix(deps)
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /docker/go
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      - dependency-name: mongo
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: build
