services:
  go:
    build:
      context: .
      dockerfile: docker/go/Dockerfile
    container_name: go_app
    environment:
      DATABASE_URL: mongodb://${MONGO_USERNAME:-cryptlink}:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@mongo:27017/?authSource=admin
      DATABASE_NAME: ${DATABASE_NAME:-onetime}
      PORT: "8080"
    depends_on:
      mongo:
        condition: service_healthy
    stop_grace_period: 25s
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: nginx_front
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - go
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: mongo_db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-cryptlink}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo7-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo7-data:
