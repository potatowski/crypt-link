# Usage: DOMAIN=example.com docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# Caddy obtains and renews certificates automatically; ports 80 and 443 must be reachable.
services:
  nginx:
    ports: !reset []

  caddy:
    image: caddy:2.10-alpine
    container_name: caddy_tls
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the public host name}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
